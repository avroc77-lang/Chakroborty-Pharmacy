<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chakraborti Pharmacy Hisab Khata</title>
    <!-- Google API & Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>

    <h1>Chakraborti Pharmacy Hisab Khata</h1>
    <button id="authorize_button" onclick="handleAuthClick()">Google Drive Connect / Sync</button>
    
    <script>
      // আপনার প্রদান করা Client ID
      const CLIENT_ID = '596428649289-mdil8mq4gtm5pn9542ek1jc6h0r72jli.apps.googleusercontent.com';
      const SCOPES = 'https://www.googleapis.com/auth/drive.file';

      let tokenClient;
      let gapiInited = false;
      let gsisInited = false;

      function gapiLoaded() {
        gapi.load('client', initializeGapiClient);
      }

      async function initializeGapiClient() {
        await gapi.client.init({
          discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
        });
        gapiInited = true;
      }

      function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: '', // defined later
        });
        gsisInited = true;
      }

      function handleAuthClick() {
        tokenClient.callback = async (resp) => {
          if (resp.error !== undefined) {
            throw (resp);
          }
          console.log('Google Drive Authenticated Successfully');
          // অটো-ব্যাকআপ কল হবে
          autoBackupToDrive();
        };

        if (gapi.client.getToken() === null) {
          tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
          tokenClient.requestAccessToken({prompt: ''});
        }
      }

      // অটোমেটিক ড্রাইভে ব্যাকআপ নেওয়ার ফাংশন
      function autoBackupToDrive() {
        const fileContent = JSON.stringify(localStorage); // আপনার হিসাবের ডাটা
        const file = new Blob([fileContent], {type: 'application/json'});
        const metadata = {
          'name': 'Pharmacy_Hisab_Khata_Backup.json',
          'mimeType': 'application/json'
        };

        const accessToken = gapi.client.getToken().access_token;
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', file);

        fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
          body: form
        }).then((res) => res.json())
          .then(function(val) {
            console.log('Backup successful:', val);
            alert('আপনার হিসাব খাতার ডাটা সফলভাবে গুগল ড্রাইভে ব্যাকআপ হয়েছে!');
          });
      }

      window.onload = function() {
        gapiLoaded();
        gisLoaded();
      };
    </script>
</body>
</html>
